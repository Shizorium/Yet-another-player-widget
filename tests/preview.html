function playlist(name,tracks){const flags={managed:true,tracks},p={id:`P${serial++}`,name,mode:0,playing:false,sounds:collection([]),getFlag:(_,key)=>flags[key],setFlag:async(_,key,value)=>{flags[key]=structuredClone(value);window.testWidget?.schedule()},async createEmbeddedDocuments(_,entries){for(const item of entries){const sf=item.flags[ID],s={...item,id:item._id,parent:p,playing:false,pausedTime:null,sound:{currentTime:43,duration:sf.duration},getFlag:(_,key)=>sf[key]};p.sounds.contents.push(s)}},async updateEmbeddedDocuments(_,entries){for(const item of entries)Object.assign(p.sounds.get(item._id),item)},async deleteEmbeddedDocuments(_,ids){p.sounds.contents.splice(0,p.sounds.contents.length,...p.sounds.contents.filter(s=>!ids.includes(s.id)))},async update(data){Object.assign(p,{...data,sounds:p.sounds});for(const item of data.sounds??[])Object.assign(p.sounds.get(item._id),item);window.testWidget?.refresh()},async playSound(sound){for(const s of p.sounds.contents){s.playing=s===sound;if(s!==sound)s.pausedTime=null}p.playing=true;window.testWidget?.refresh()},async stopAll(){p.playing=false;for(const s of p.sounds.contents){s.playing=false;s.pausedTime=null}window.testWidget?.refresh()},async playNext(id,{direction}){const i=p.sounds.contents.findIndex(s=>s.id===id);await p.playSound(p.sounds.contents[(i+direction+p.sounds.contents.length)%p.sounds.contents.length])},async delete(){documents.splice(documents.indexOf(p),1);window.testWidget?.refresh()}};documents.push(p);return p}
